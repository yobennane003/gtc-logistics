name: Validate AfCFTA Rule Execution

on: [push, pull_request, workflow_dispatch]

jobs:
  evaluate-rule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Rule Evaluation Script
        run: |
          node -e '
            const rule = require("./rules/rule_afcfta_fertilizers.json");
            const tx = require("./tests/test_shipment_kenya.json");
            
            console.log("==========================================");
            console.log("=== بدء تقييم المعاملة اللوجستية آلياً ===");
            console.log("==========================================");
            console.log("رقم الشحنة:", tx.transaction_id);
            console.log("وصف السلعة:", tx.consignment.product_description);
            console.log("البند الجمركي (HS Code):", tx.consignment.hs_code);
            console.log("ميناء الانطلاق:", tx.logistics.origin_port);
            console.log("ميناء الوصول:", tx.logistics.destination_port);
            
            // حساب القيمة المضافة الإفريقية (VAM)
            const price = tx.consignment.ex_works_price;
            const vnm = tx.consignment.non_originating_materials_value;
            const vam = ((price - vnm) / price) * 100;
            console.log("\n--- معايير التحقق من المنشأ ---");
            console.log("نسبة القيمة المضافة المحسوبة:", vam.toFixed(2) + "%");
            console.log("الحد الأدنى المطلوب:", rule.conditions.all.find(c => c.variable === "origin.value_added_percent").parameters.threshold + "%");
            
            const isDirect = tx.logistics.direct_consignment === true;
            const isValidOrigin = vam >= 35.0;
            
            console.log("\n--- نتيجة المطابقة القانونية ---");
            if (isValidOrigin && isDirect) {
              console.log(" الحالة: مطابقة تامة لقواعد منشأ AfCFTA");
              console.log(" الإجراء التنظيمي:", rule.outcomes.regulatory_action);
              console.log(" التعريفة الجمركية التفضيلية:", rule.outcomes.customs_duty_rate + "%");
              console.log(" الشهادة المطلوبة:", rule.outcomes.certification_required);
              console.log("==========================================");
            } else {
              console.error("❌ فشل المطابقة: الشروط غير مستوفاة");
              process.exit(1);
            }
          '
